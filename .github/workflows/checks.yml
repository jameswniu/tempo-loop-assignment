name: checks
on:
  push:
    branches: [main]
  pull_request:
# The job runs whatever npm scripts a pull request carries, so the token it
# holds is read-only and is not left in the checkout for those scripts to find.
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run figures:check
      - run: npm run build
      - run: cd frontend && npm ci && npm run build
