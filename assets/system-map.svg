<text x="430" y="220" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e">pure, so a fixture pins it</text>
<rect x="430" y="242" width="340" height="188" fill="#161b22" stroke="url(#rim)" stroke-width="1.5"/><rect x="431.5" y="243.5" width="337" height="1" fill="#ffffff" fill-opacity="0.18"/>
<text x="450" y="282" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#ffffff" font-weight="700">computeInsights</text>
<text x="450" y="316" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#c9d1d9">half-open [from, to)</text>
