<rect width="1200" height="486" fill="#0f1319"/>
<rect x="0" y="0" width="6" height="486" fill="#345c8f"/>
<text x="56" y="58" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#8b949e" letter-spacing="4">SYSTEM MAP</text>
<text x="56" y="108" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" fill="#ffffff" font-weight="700">One query in, one checked answer</text>
