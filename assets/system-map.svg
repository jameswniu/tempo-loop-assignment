<text x="76" y="282" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#ffffff" font-weight="700">GraphQL search</text>
<text x="76" y="316" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#c9d1d9">merged: does the window</text>
<text x="76" y="346" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#c9d1d9">50 pull requests a page</text>
