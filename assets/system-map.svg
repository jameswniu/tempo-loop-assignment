<text x="918" y="108" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#8b949e">N / 50 calls</text>
<text x="56" y="190" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#7aa2d4" letter-spacing="2">01  FETCH</text>
