<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 486" width="100%" role="img" aria-label="System map">
<rect x="0.5" y="0.5" width="1199" height="485" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="56" y="58" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#57606a" letter-spacing="4">REQUEST PATH</text>
<text x="56" y="108" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" fill="#1f2328" font-weight="700">How a request flows</text>
<text x="56" y="144" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#57606a">Fetch, compute, check the narrative against the numbers.</text>
<rect x="900" y="40" width="244" height="84" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="918" y="76" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" font-weight="700">2 endpoints</text>
<text x="918" y="108" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#57606a">N / 50 calls</text>
<text x="56" y="190" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#345c8f" letter-spacing="2">01  FETCH</text>
<text x="56" y="220" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#57606a">one GraphQL search</text>
<rect x="56" y="242" width="340" height="188" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="76" y="282" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" font-weight="700">GraphQL search</text>
<text x="76" y="316" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328">merged: does the window</text>
<text x="76" y="346" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328">50 pull requests a page</text>
<text x="76" y="376" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328">bots by __typename</text>
<text x="76" y="412" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#57606a">src/github/client.ts</text>
<text x="430" y="190" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#345c8f" letter-spacing="2">02  COMPUTE</text>
<text x="430" y="220" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#57606a">a pure function</text>
<rect x="430" y="242" width="340" height="188" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="450" y="282" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" font-weight="700">computeInsights</text>
<text x="450" y="316" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328">half-open [from, to)</text>
<text x="450" y="346" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328">no self-review counts</text>
<text x="450" y="376" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328">sums back to merged</text>
<text x="450" y="412" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#57606a">src/metrics/compute.ts</text>
<text x="804" y="190" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#345c8f" letter-spacing="2">03  GROUND</text>
<text x="804" y="220" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#57606a">every citation checked</text>
<rect x="804" y="242" width="340" height="188" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="824" y="282" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2328" font-weight="700">generateNarrative</text>
<text x="824" y="316" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328">fact table in, JSON out</text>
<text x="824" y="346" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328">each citation looked up</text>
<text x="824" y="376" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328">a mismatch is a 502</text>
<text x="824" y="412" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#57606a">src/llm/narrative.ts</text>
